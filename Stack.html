<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tetris – GameHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
/* ------------------ THEME VARIABLES ------------------ */
:root {
  --bg1: #0d1b2a;
  --bg2: #1b263b;
  --accent: #ffd166;
  --text: #eee;
  --grid: #1e3a5f;
  --glow: 0 0 8px rgba(255,255,255,0.5);
}

body.dark {
  --bg1: #000000;
  --bg2: #111;
  --grid: #333;
  --text: #fff;
}

/* ------------------ GENERAL PAGE ------------------ */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(160deg, var(--bg1), var(--bg2));
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ------------------ HEADER ------------------ */
header {
  background: #0a0f1a;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 2rem;
  padding: 1rem 2rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.6);
}

header h1 {
  font-family: "Montserrat", sans-serif;
  color: var(--accent);
  cursor: pointer;
  margin: 0;
  font-size: 28px;
}

/* ------------------ NAV ------------------ */
nav ul {
  list-style: none;
  display: flex;
  gap: 1.5rem;
  margin: 0;
  padding: 0;
}
nav ul li {
  cursor: pointer;
  font-weight: 600;
  transition: 0.3s;
}
nav ul li:hover {
  color: var(--accent);
}

.theme-btn {
  background: var(--accent);
  padding: 0.4rem 0.8rem;
  border-radius: 6px;
  font-weight: bold;
  border: none;
  cursor: pointer;
  color: #000;
}

/* ------------------ MAIN ------------------ */
main {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 20px;
}

#scoreDisplay {
  font-size: 1.4rem;
  margin-bottom: 12px;
  font-weight: bold;
}

/* ------------------ GAME CANVAS ------------------ */
canvas {
  background: linear-gradient(180deg, #112233, #09121c);
  border: 4px solid #222;
  border-radius: 10px;
  box-shadow: 0 0 20px #000a, inset 0 0 10px #000;
}

/* ------------------ GAME OVER BOX ------------------ */
#gameOverOverlay {
  display: none;
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  background: rgba(10,10,20,0.95);
  padding: 40px 50px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 0 15px #000;
}

#gameOverOverlay h2 {
  color: var(--accent);
  margin-bottom: 10px;
  font-size: 28px;
}

#restartButton {
  margin-top: 10px;
  padding: 12px 30px;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: bold;
  background: var(--accent);
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <h1 onclick="location.href='home.html'">GameHub</h1>
  <nav>
    <ul>
      <li onclick="location.href='home.html'">Home</li>
      <li onclick="location.href='build.html'">Construction Games</li>
    </ul>
  </nav>
  <button id="themeBtn" class="theme-btn">Theme: Light</button>
</header>

<main>
  <div id="scoreDisplay">Score: 0</div>
  <canvas id="gameCanvas" width="300" height="600"></canvas>
</main>

<!-- GAME OVER OVERLAY -->
<div id="gameOverOverlay">
  <h2>Game Over</h2>
  <p id="finalScore"></p>
  <button id="restartButton">Restart</button>
</div>

<script>
/* ======================= SETTINGS ======================= */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let rows = 20;
let cols = 10;
let blockSize = 30;

let board = [];
let score = 0;
let gameOver = false;

const scoreDisplay = document.getElementById("scoreDisplay");
const overlay = document.getElementById("gameOverOverlay");
const finalScore = document.getElementById("finalScore");

/* ======================= COLORS ======================= */
const colors = {
  "I": "#00e5ff",
  "J": "#3d5afe",
  "L": "#ff9100",
  "O": "#ffd600",
  "S": "#69f0ae",
  "T": "#d500f9",
  "Z": "#ff1744"
};

/* Glow for blocks */
function drawBlock(x, y, color) {
  ctx.fillStyle = color;
  ctx.shadowBlur = 12;
  ctx.shadowColor = color;
  ctx.fillRect(x * blockSize, y * blockSize, blockSize - 1, blockSize - 1);
}

/* ======================= PIECES ======================= */
const shapes = {
  I: [[1,1,1,1]],
  J: [[1,0,0],[1,1,1]],
  L: [[0,0,1],[1,1,1]],
  O: [[1,1],[1,1]],
  S: [[0,1,1],[1,1,0]],
  T: [[0,1,0],[1,1,1]],
  Z: [[1,1,0],[0,1,1]]
};

class Piece {
  constructor(type) {
    this.type = type;
    this.shape = shapes[type];
    this.color = colors[type];
    this.x = 3;
    this.y = 0;
  }

  draw() {
    for (let r=0; r<this.shape.length; r++) {
      for (let c=0; c<this.shape[r].length; c++) {
        if (this.shape[r][c]) drawBlock(this.x+c, this.y+r, this.color);
      }
    }
  }

  moveDown() {
    this.y++;
    if (this.collision()) {
      this.y--;
      this.lock();
      newPiece();
    }
  }

  moveLeft() {
    this.x--;
    if (this.collision()) this.x++;
  }

  moveRight() {
    this.x++;
    if (this.collision()) this.x--;
  }

  rotate() {
    const prev = this.shape;
    this.shape = this.shape[0].map((_, i) =>
      this.shape.map(row => row[i]).reverse()
    );
    if (this.collision()) this.shape = prev;
  }

  collision() {
    for (let r=0; r<this.shape.length; r++) {
      for (let c=0; c<this.shape[r].length; c++) {
        if (this.shape[r][c]) {
          let nx = this.x + c;
          let ny = this.y + r;
          if (nx < 0 || nx >= cols || ny >= rows) return true;
          if (ny >= 0 && board[ny][nx] !== "") return true;
        }
      }
    }
    return false;
  }

  lock() {
    for (let r=0; r<this.shape.length; r++) {
      for (let c=0; c<this.shape[r].length; c++) {
        if (this.shape[r][c] && this.y+r >= 0) {
          board[this.y+r][this.x+c] = this.color;
        }
      }
    }

    // clear rows
    let lines = 0;
    for (let r=0; r<rows; r++) {
      if (board[r].every(cell => cell !== "")) {
        board.splice(r, 1);
        board.unshift(new Array(cols).fill(""));
        lines++;
      }
    }
    score += lines * 100;
    scoreDisplay.textContent = "Score: " + score;

    if (board[0].some(cell => cell !== "")) endGame();
  }
}

/* ======================= GAME SETUP ======================= */
function newPiece() {
  const types = Object.keys(shapes);
  piece = new Piece(types[Math.floor(Math.random()*types.length)]);
}

function resetBoard() {
  board = [];
  for (let r=0; r<rows; r++) board[r] = new Array(cols).fill("");
}

function drawBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let r=0; r<rows; r++) {
    for (let c=0; c<cols; c++) {
      if (board[r][c] !== "") {
        drawBlock(c, r, board[r][c]);
      }
    }
  }
}

/* ======================= GAME LOOP ======================= */
let piece;
let dropTimer = 0;

function update(time = 0) {
  if (gameOver) return;

  if (time - dropTimer > 600) {
    piece.moveDown();
    dropTimer = time;
  }

  drawBoard();
  piece.draw();

  requestAnimationFrame(update);
}

/* ======================= INPUT ======================= */
document.addEventListener("keydown", (e) => {
  if (gameOver) return;

  if (e.key === "ArrowLeft") piece.moveLeft();
  if (e.key === "ArrowRight") piece.moveRight();
  if (e.key === "ArrowDown") piece.moveDown();
  if (e.key === "ArrowUp") piece.rotate();
});

/* ======================= GAME OVER ======================= */
function endGame() {
  gameOver = true;
  finalScore.textContent = "Score: " + score;
  overlay.style.display = "block";
}

document.getElementById("restartButton").onclick = () => {
  overlay.style.display = "none";
  startGame();
};

/* ======================= THEME SWITCH ======================= */
document.getElementById("themeBtn").onclick = () => {
  document.body.classList.toggle("dark");
  themeBtn.textContent =
    document.body.classList.contains("dark") ? "Theme: Dark" : "Theme: Light";
};

/* ======================= START GAME ======================= */
function startGame() {
  score = 0;
  gameOver = false;
  resetBoard();
  newPiece();
  update();
}
startGame();
</script>

</body>
</html>
